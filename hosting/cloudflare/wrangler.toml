# Cloudflare Pages configuration for the web app. `make deploy-web` assembles web/deploy from the
# built app plus this directory and publishes it (hosting/README.md).
name = "infercat"
compatibility_date = "2026-09-01"
pages_build_output_dir = "../../web/deploy"

[[analytics_engine_datasets]]
binding = "LOADS"
dataset = "infercat_loads"

# PM creates the namespace and replaces this placeholder at landing, before deployment.
[[kv_namespaces]]
binding = "SIGNUPS"
id = "0ec8d22651a147cca7525ffd93ea5707"
