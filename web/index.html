<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%PRODUCT_NAME%" />
    <!-- The two faces, self-hosted, on the first screen: no request leaves for a font (038 promise 3,
         Protection 3). Preloaded because @font-face inside the CSS bundle is found one round trip late. -->
    <link rel="preload" href="/fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- %PRODUCT_NAME%, %PRODUCT_DESCRIPTION% and %WEB_URL% are filled in by the plugin in
         vite.config.ts from src/product.ts and the build environment: the name lives in one place. -->
    <title>%PRODUCT_NAME%</title>
    <meta name="description" content="%PRODUCT_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%PRODUCT_NAME%" />
    <meta property="og:title" content="%PRODUCT_NAME%" />
    <meta property="og:description" content="%PRODUCT_DESCRIPTION%" />
    <meta property="og:image" content="%WEB_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chat with a friend's GPU. — Infercat" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PRODUCT_NAME%" />
    <meta name="twitter:description" content="%PRODUCT_DESCRIPTION%" />
    <meta name="twitter:image" content="%WEB_URL%/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
