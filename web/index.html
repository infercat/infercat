<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <!-- %PRODUCT_NAME%, %PRODUCT_DESCRIPTION% and %WEB_URL% are filled in by the plugin in
         vite.config.ts from src/product.ts and the build environment: the name lives in one place. -->
    <title>%PRODUCT_NAME%</title>
    <meta name="description" content="%PRODUCT_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%PRODUCT_NAME%" />
    <meta property="og:title" content="%PRODUCT_NAME%" />
    <meta property="og:description" content="%PRODUCT_DESCRIPTION%" />
    <meta property="og:image" content="%WEB_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The connect screen: one field for the invite code and a Connect button." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PRODUCT_NAME%" />
    <meta name="twitter:description" content="%PRODUCT_DESCRIPTION%" />
    <meta name="twitter:image" content="%WEB_URL%/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
