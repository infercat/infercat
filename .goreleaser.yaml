# Release engineering for the host binary (ticket 017; publishing wired by 030). What this file can
# publish, and when:
#   - `make release-dry` runs goreleaser with --snapshot --skip=publish: every artifact is built into
#     dist/, the Homebrew formula is written to dist/homebrew/, and nothing leaves the machine.
#   - `make release-publish` (only from .github/workflows/release.yml, only on a v* tag) creates the
#     GitHub Release with the archives and the checksums file. The formula is still not pushed
#     anywhere until `brews[].skip_upload` below is flipped (docs/RELEASE.md, the day the tap exists).
#
# Run it through the Makefile, never bare: the Makefile is what reads CLI_NAME and PRODUCT_VERSION
# out of internal/product/product.go, because the product name and version live in one constant
# (docs/PRINCIPLES.md) and this file must not become a second copy of them.
version: 2

snapshot:
  # An untagged tree still builds a named, versioned set of artifacts: the version the source says.
  version_template: "{{ .Env.PRODUCT_VERSION }}"

builds:
  - id: cli
    main: ./cmd/infercat
    binary: "{{ .Env.CLI_NAME }}"
    env:
      - CGO_ENABLED=0
    # -trimpath drops build paths, -s -w drop the symbol and DWARF tables: same input, same bytes,
    # and nothing in the binary says where it was built.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/infercat/infercat/internal/product.Version={{ .Version }}
      - -X github.com/infercat/infercat/internal/product.Commit={{ .FullCommit }}
      - -X github.com/infercat/infercat/internal/product.Date={{ .CommitDate }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      # Windows on arm64 is not a host we have ever run; add it when someone asks.
      - goos: windows
        goarch: arm64

archives:
  - id: cli
    ids: [cli]
    name_template: "{{ .Env.CLI_NAME }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # What a host needs beside the binary: how to run it, and who else's work is inside it.
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md

  - id: web
    # A meta archive carries no binary: this is the static web app, zipped on its own so a host can
    # self-serve it (`web-<version>.zip`, unzip and point any static server at it). `make web`
    # builds web/dist first; `make release-dry` depends on it.
    meta: true
    name_template: "web-{{ .Version }}"
    formats: [zip]
    files:
      - src: web/dist
        dst: .
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: "{{ .Env.CLI_NAME }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  # The GitHub Release a v* tag produces (release.yml). Draft, so the founder reads the generated
  # notes and the CHANGELOG entry side by side before anyone sees it; prerelease decided by the tag.
  github:
    owner: infercat
    name: infercat
  draft: true
  prerelease: auto
  name_template: "{{ .Env.CLI_NAME }} {{ .Version }}"

brews:
  # Binary formula for macOS and Linux; uploads stay disabled until the tap exists.
  - name: "{{ .Env.CLI_NAME }}"
    ids: [cli]
    repository:
      owner: infercat
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    skip_upload: true
    commit_author:
      name: goreleaser
      email: noreply@2185lab.com
    license: MIT
    homepage: https://infercat.ai
    description: "Share the model on your machine with friends: one binary, one invite code, a browser"
    install: |
      bin.install "{{ .Env.CLI_NAME }}"
    test: |
      system "#{bin}/{{ .Env.CLI_NAME }}", "version"
