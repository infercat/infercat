name: Bug
description: Something the host or the web app does that it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
      description: One paragraph is enough. Screenshots of the web app help; the header pill (e.g. "relayed via nyc · 64 ms") is useful.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: infercat version
      description: Paste the output of `infercat version`. For the web app, Settings shows "App version".
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: infercat status
      description: Paste the output of `infercat status` while the host is running. It contains no secrets — key ids, counters, the upstream, the relay.
      render: text
  - type: dropdown
    id: side
    attributes:
      label: Which side
      options:
        - Host (the binary)
        - Friend (the web app)
        - Both / not sure
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Inference server
      placeholder: "llama.cpp b9553 / vLLM 0.25 / Ollama 0.12 / LM Studio 0.4"
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 15 arm64 host; friend on iPhone Safari"
