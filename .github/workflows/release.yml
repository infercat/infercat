# The release: on a version tag, goreleaser builds every artifact and publishes a GitHub Release
# with the archives, the checksums file and the Homebrew formula (docs/RELEASE.md is the runbook).
# Until the founder tags (pm/LAUNCH.md F4), this workflow is only ever run by hand as a snapshot:
# `workflow_dispatch` builds the same artifacts with --snapshot --skip=publish and uploads them as a
# workflow artifact, so the release path is exercised without releasing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release and upload its assets (tag builds only)

env:
  GOTOOLCHAIN: auto

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Notices, then the web bundle (the release depends on both)
        run: |
          make notices-check
          make web

      - uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Snapshot (manual run — publishes nothing)
        if: github.event_name == 'workflow_dispatch'
        run: make release-dry

      - name: Release (tag — publishes the GitHub Release)
        if: startsWith(github.ref, 'refs/tags/v')
        # Through make, never bare: the Makefile reads CLI_NAME and PRODUCT_VERSION out of
        # internal/product/product.go (pm/BELIEFS.md: the name lives in one constant).
        run: make release-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Homebrew tap lives in another repository, which GITHUB_TOKEN cannot push to. A
          # fine-grained PAT with contents:write on 2185Lab/homebrew-tap, stored as this secret,
          # lets goreleaser commit the formula there (.goreleaser.yaml `homebrew_casks`). TODO(tap): store the PAT the day 2185Lab/homebrew-tap exists.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt
            dist/homebrew/**
          retention-days: 7
