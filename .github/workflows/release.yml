# The release: on a version tag, goreleaser builds every artifact and publishes a GitHub Release
# with the archives, the checksums file and the Homebrew formula (docs/RELEASE.md is the runbook).
# Until the first tag, this workflow is only ever run by hand as a snapshot:
# `workflow_dispatch` builds the same artifacts with --snapshot --skip=publish and uploads them as a
# workflow artifact, so the release path is exercised without releasing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release and upload its assets (tag builds only)
  packages: write # publish GHCR images on version tags

env:
  GOTOOLCHAIN: auto

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Notices, then the web bundle (the release depends on both)
        run: |
          make notices-check
          make web

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          install-only: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot (manual run — publishes nothing)
        if: github.event_name == 'workflow_dispatch'
        run: make release-dry

      - name: Verify snapshot Linux packages and user service
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python3 packaging/verify-snapshot.py

      - name: Verify snapshot image metadata
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PYIMAGE'
          import json, subprocess, tarfile, io
          refs = subprocess.check_output(['docker', 'image', 'ls', 'ghcr.io/infercat/infercat', '--format', '{{.Repository}}:{{.Tag}}'], text=True).splitlines()
          assert len(refs) == 2, refs
          images = json.loads(subprocess.check_output(['docker', 'image', 'inspect', *refs]))
          assert sorted(i['Architecture'] for i in images) == ['amd64', 'arm64']
          for image in images:
              cfg = image['Config']
              assert cfg['User'] == '65532:65532'
              assert cfg['Entrypoint'] == ['infercat']
              assert cfg['Cmd'] == ['serve', '--data-dir', '/data']
              assert '/data' in cfg['Volumes']
              cid = subprocess.check_output(['docker', 'create', '--platform=linux/' + image['Architecture'], image['Id']], text=True).strip()
              try:
                  with tarfile.open(fileobj=io.BytesIO(subprocess.check_output(['docker', 'export', cid]))) as archive:
                      directory = archive.getmember('data')
                      assert (directory.uid, directory.gid) == (65532, 65532) and directory.mode & 0o700 == 0o700, (directory.uid, directory.gid, oct(directory.mode))
                      print(image['Architecture'] + ': /data owner=' + str(directory.uid) + ':' + str(directory.gid) + ' mode=' + oct(directory.mode))
                      assert 'bin/sh' not in archive.getnames() and 'usr/bin/sh' not in archive.getnames()
              finally:
                  subprocess.run(['docker', 'rm', '-v', cid], check=True, stdout=subprocess.DEVNULL)
              print(image['Architecture'] + ': non-root, writable /data, entrypoint/CMD and shell-free filesystem verified')
          PYIMAGE

      - name: Release (tag — publishes the GitHub Release)
        if: startsWith(github.ref, 'refs/tags/v')
        # Through make, never bare: the Makefile reads CLI_NAME and PRODUCT_VERSION out of
        # internal/product/product.go (docs/PRINCIPLES.md: the name lives in one constant).
        run: make release-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Homebrew tap lives in another repository, which GITHUB_TOKEN cannot push to. A
          # fine-grained PAT with contents:write on infercat/homebrew-tap, stored as this secret,
          # lets goreleaser commit the formula there (.goreleaser.yaml `brews`). TODO(tap): store the PAT the day infercat/homebrew-tap exists.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          name: snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*_checksums.txt
            dist/homebrew/**
          retention-days: 7
