# Every push: the Go checks, the web checks, the notices gate, and a full release dry run —
# all from this fresh checkout, which is the "green from nothing" law (docs/PRINCIPLES.md). Nothing here
# publishes; release.yml is the only workflow that can, and only on a tag.
name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  check:
    name: check · web · notices · release-dry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser reads the commit and its date for the version stamp

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache Worker npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node22-bridge-${{ hashFiles('bridge/package-lock.json') }}

      - name: Playwright version
        id: playwright
        run: |
          make web-deps
          node -p '"version=" + require("./web/node_modules/playwright/package.json").version' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      # Browser binaries are cached; each fresh runner still needs its OS packages.
      - name: Playwright system dependencies
        run: pnpm --dir web exec playwright install-deps chromium

      - name: go-licenses
        run: go install github.com/google/go-licenses@v1.6.0

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          install-only: true

      - uses: docker/setup-buildx-action@v4

      - name: Check and release dry run (every proof once, nothing published)
        env:
          INFERCAT_REQUIRE_SANDBOX: "1"
        run: |
          go build ./...
          # The Playwright-version step already installed the locked workspace.
          # One make graph shares all other prerequisites; no proof is skipped.
          make -o web-deps check release-dry

      - name: Linux agent confinement — pinned harness and canaries
        env:
          INFERCAT_REQUIRE_SANDBOX: "1"
        run: |
          go build -o "$RUNNER_TEMP/infercat-agent-probe" ./cmd/infercat
          "$RUNNER_TEMP/infercat-agent-probe" --data-dir "$RUNNER_TEMP/agent-fixture" agent install
          INFERCAT_AGENT_TEST_INSTALL="$RUNNER_TEMP/agent-fixture" go test -race -v -count=1 ./internal/agent -run '^Test161|^TestPinned'

      - name: Every artifact has a checksum
        run: |
          cd dist
          shasum -a 256 -c *_checksums.txt

      - uses: actions/upload-artifact@v6
        with:
          name: release-dry-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*_checksums.txt
            dist/homebrew/**
          retention-days: 7
