# Every push and PR: the Go checks, the web checks, the notices gate, and a full release dry run —
# all from this fresh checkout, which is the "green from nothing" law (docs/PRINCIPLES.md). Nothing here
# publishes; release.yml is the only workflow that can, and only on a tag.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  check:
    name: check · web · notices · release-dry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser reads the commit and its date for the version stamp

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache Worker npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node22-bridge-${{ hashFiles('bridge/package-lock.json') }}

      - name: Playwright version
        id: playwright
        run: |
          pnpm --dir web install --frozen-lockfile
          node -p '"version=" + require("./web/node_modules/playwright/package.json").version' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      # Browser binaries are cached; each fresh runner still needs its OS packages.
      - name: Playwright system dependencies
        run: pnpm --dir web exec playwright install-deps chromium

      - name: Go and Worker — build, vet, test
        run: |
          go build ./...
          make check

      - name: Web — install, typecheck, test, lint
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm lint

      - name: go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Third-party notices are current
        run: make notices-check

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          install-only: true

      - uses: docker/setup-buildx-action@v4

      - name: Release dry run (every artifact, nothing published)
        run: make release-dry

      - name: Every artifact has a checksum
        run: |
          cd dist
          shasum -a 256 -c *_checksums.txt

      - uses: actions/upload-artifact@v6
        with:
          name: release-dry-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*_checksums.txt
            dist/homebrew/**
          retention-days: 7
